# Runs on every push and pull request: type check, unit tests, build, and a security audit of
# production dependencies (fails on high/critical vulnerabilities). No secrets are used.
name: checks
on:
  push:
    branches: [develop, main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          CI: "true"
